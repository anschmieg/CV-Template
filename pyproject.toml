[project]
name = "cv"
version = "0.1.0"
description = "CV RenderCV theme with a minimal render wrapper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "rendercv>=2.8",
  "pyyaml>=6.0.2",
]

[project.scripts]
cv = "cv.cli:main"
anschmiegcv = "cv.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["cv", "cv.*", "cv_tools", "cv_tools.*"]

[tool.setuptools.package-data]
cv = [
  "*.typ",
  "entries/*.typ",
]
