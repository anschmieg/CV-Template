design:
  theme: anschmiegcv

  page:
    size: a4
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: true
    show_top_note: false

  colors:
    accent: "#ad33a9"
    base: "#493f52"

  typography:
    font_family:
      body: Atkinson Hyperlegible
      name: Atkinson Hyperlegible
      headline: Atkinson Hyperlegible
      connections: Atkinson Hyperlegible
      section_titles: Atkinson Hyperlegible
    font_size:
      body: 10pt
      name: 28pt
      headline: 10pt
      connections: 9pt
      section_titles: 1.4em
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: left
    bold:
      name: false
      headline: false
      connections: false
      section_titles: false
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: true

  links:
    underline: false
    show_external_link_icon: true

  html:
    layout: split
    content_width: 84rem
    sidebar_width: 20rem
    density: comfortable
    type_scale: 1.0
    motion: true

  header:
    alignment: center
    photo_width: 4cm
    photo_space_left: 0cm
    photo_space_right: 0cm
    space_below_name: 0.5cm
    connections:
      show_icons: true
      separator: ""
      space_between_connections: 0.5cm

  section_titles:
    type: with_full_line
    line_thickness: 0.125pt
    space_above: 0.8cm
    space_below: 0.3cm

  sections:
    space_between_regular_entries: 0.5cm

  entries:
    allow_page_break: true
    date_and_location_width: 3cm
    space_between_columns: 1cm

  templates:
    footer: "NAME -- Seite PAGE_NUMBER von TOTAL_PAGES"
    single_date: "MONTH_IN_TWO_DIGITS/YEAR"
    date_range: "START_DATE – END_DATE"
    education_entry:
      main_column: |
        {weight:400}AREA, DEGREE
        {weight:700}INSTITUTION
        HIGHLIGHTS
      date_and_location_column: "DATE\nLOCATION"
      degree_column: null
    experience_entry:
      main_column: |
        **POSITION, COMPANY**
        HIGHLIGHTS
      date_and_location_column: "DATE\nLOCATION"
